<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Student PDF Generator</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 1. jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- 2. jsPDF AutoTable Plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Container Card -->
  <div class="bg-white max-w-xl w-full rounded-2xl shadow-md border border-gray-200 p-6 space-y-6">
    
    <!-- Header -->
    <div class="border-b border-gray-100 pb-4">
      <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        <i class="fa-solid fa-file-pdf text-red-500"></i> Student PDF Generator
      </h1>
      <p class="text-xs text-gray-500 mt-1">Aasan aur simple tareeqay se PDF report download karein</p>
    </div>

    <!-- Filter Info Badge -->
    <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-800">
      <p class="font-semibold"><i class="fa-solid fa-filter mr-1"></i> Active Filter Rule:</p>
      <p class="text-blue-600 mt-0.5">(Age &gt; 20 AND Name == "ali") OR Course == "wma"</p>
    </div>

    <!-- Student Data Table Preview -->
    <div>
      <h2 class="text-sm font-semibold text-gray-700 mb-2">Filtered Students Preview</h2>
      <div class="overflow-hidden border border-gray-200 rounded-xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase">
            <tr>
              <th class="py-2.5 px-3">S.No</th>
              <th class="py-2.5 px-3">Name</th>
              <th class="py-2.5 px-3">Age</th>
              <th class="py-2.5 px-3">Course</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-700">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Download PDF Button -->
    <button id="downloadBtn" class="w-full py-3 bg-red-600 hover:bg-red-700 active:scale-98 text-white font-medium text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
      <i class="fa-solid fa-download"></i> Download PDF Report
    </button>

  </div>

  <script src="app.js"></script>
  </body>
</html>
